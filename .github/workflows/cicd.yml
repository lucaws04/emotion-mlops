name: CI/CD Pipeline

on: 
  push: 
    branches: [main]
  pull_request: 

env: 
  REGISTRY: docker.io
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/nlp9
  RESOURCE_GROUP: buas-y2
  ENVIRONMENT: lambda-0-environment
  REGION: westeurope
  BACKEND_APP: nlp9

jobs: 
  lint: 
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with: 
          python-version: '3.10'
      - run: pip install flake8
      - run: flake8 .

  test: 
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v2
      
      - uses: actions/setup-python@v2
        with: 
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install coverage pytest-asyncio

      - name: Add source directory to PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}/src" >> $GITHUB_ENV

      - name: Run tests with coverage
        run: |
          set -o pipefail
          coverage run -m pytest
          coverage report -m --include="src/*,app/*,test/*"

  docker: 
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps: 
      - uses: actions/checkout@v2
      - uses: docker/login-action@v1
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Backend
        run: |
          docker build -t $IMAGE_BACKEND:${{ github.sha }} -f Dockerfile .
          docker tag $IMAGE_BACKEND:${{ github.sha }} $IMAGE_BACKEND:latest
          docker push $IMAGE_BACKEND:${{ github.sha }}
          docker push $IMAGE_BACKEND:latest

  deploy: 
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: docker
    steps: 
      - uses: azure/login@v1
        with: 
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Backend Container App
        run: |
          az containerapp update \
            --name $BACKEND_APP \
            --resource-group $RESOURCE_GROUP \
            --image $IMAGE_BACKEND:${{ github.sha }}
      
          az containerapp ingress update \
            --name $BACKEND_APP \
            --resource-group $RESOURCE_GROUP \
            --type internal \
            --target-port 8000
