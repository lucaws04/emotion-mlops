[tool.poetry]
name = "src"
version = "0.1.0"
description = "A natural language processing project"
authors = ["ayumichotoe236730 <ayumikomijn@gmail.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry2conda]
name = "mark-processor"


[tool.poetry.dependencies]
python = ">=3.9,<4.0"
pandas = ">=2.2.3,<3.0.0"
scikit-learn = ">=1.6.1,<2.0.0"
pre-commit = ">=4.2.0,<5.0.0"
torch = "==2.7.1"
torchvision = "==0.22.1"
torchaudio = "==2.7.1"
numpy = ">=1.26.0,<2.0.0"
azure-ai-ml = "^1.27.1"
azure-identity = "^1.23.0"
isort = "^6.0.1"
flake8 = "^7.2.0"
poetry2conda = "^0.3.0"
azure-storage-blob = ">=12.10.0,<12.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
black = "^25.1.0"
mypy = "^1.1.1"
autoflake = "^2.1.0"
# pandas-stubs = "^2.2.3.250527"
types-tqdm = "^4.67.0.20250516"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
known_first_party = ["src"]
skip_gitignore = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
